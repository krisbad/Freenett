<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNI Scanner</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#98a2b3; --line:#2a2f37; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, button { width:100%; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  textarea { min-height:120px; font-family: ui-monospace, monospace; font-size:13px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { cursor:pointer; background:var(--accent); color:#fff; border:0; font-weight:600; margin-top:12px; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); margin-top:0; width:auto; padding:7px 12px; font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:12px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #status { color:var(--muted); font-size:13px; margin-top:6px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .tools input[type=search] { flex:1; min-width:140px; }
  .tools label { display:flex; align-items:center; gap:6px; margin:0; font-size:13px; color:var(--text); }
  .tools label input { width:auto; }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; cursor:pointer; user-select:none; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>SNI Scanner</h1>

  <div class="card">
    <label for="target">Target host or IP</label>
    <input id="target" placeholder="api.quipper.com" autocapitalize="none" autocorrect="off">

    <div class="row">
      <div><label for="port">Port</label><input id="port" type="number" value="443"></div>
      <div><label for="ws">WebSocket path (optional)</label><input id="ws" placeholder="/vmess" autocapitalize="none"></div>
    </div>

    <label for="domains">Hostnames to test (one per line)</label>
    <textarea id="domains" placeholder="example.com&#10;cdn.example.com" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>

    <label for="file">...or load a .txt file</label>
    <input id="file" type="file" accept=".txt,.csv,text/plain">

    <button id="go">Scan</button>
    <div class="bar"><i id="prog"></i></div>
    <div id="status">Idle.</div>
  </div>

  <div class="card">
    <div class="tools">
      <input id="q" type="search" placeholder="Filter results...">
      <label><input id="onlyOk" type="checkbox" checked> Working only</label>
      <button class="secondary" id="copy">Copy</button>
      <button class="secondary" id="csv">CSV</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th data-k="sni">Hostname</th><th data-k="ok">Result</th><th data-k="ms">ms</th><th data-k="status">Detail</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4"><small>No results yet.</small></td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const CHUNK = 30;
let results = [];
let sortKey = "ms", sortDir = 1;

$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  const lines = text.split(/\r?\n/).map((l) => l.split(",").pop().trim()).filter(Boolean);
  $("domains").value = lines.join("\n");
  $("status").textContent = lines.length + " hostnames loaded.";
});

function render() {
  const q = $("q").value.trim().toLowerCase();
  const onlyOk = $("onlyOk").checked;
  let list = results.filter((r) => (!onlyOk || r.ok) && (!q || r.sni.includes(q) || (r.status || "").toLowerCase().includes(q)));
  list.sort((a, b) => {
    const x = a[sortKey] ?? 1e9, y = b[sortKey] ?? 1e9;
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  const tb = $("rows");
  tb.innerHTML = "";
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="4"><small>No matching results.</small></td></tr>';
    return;
  }
  for (const r of list) {
    const tr = document.createElement("tr");
    const cells = [r.sni, r.ok ? "OK" : "Fail", r.ms ?? "", r.status || ""];
    cells.forEach((c, i) => {
      const td = document.createElement("td");
      td.textContent = c;
      if (i === 1) td.className = r.ok ? "ok" : "bad";
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  }
}

document.querySelectorAll("th").forEach((th) =>
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    sortDir = sortKey === k ? -sortDir : 1;
    sortKey = k;
    render();
  })
);
$("q").addEventListener("input", render);
$("onlyOk").addEventListener("change", render);

$("go").addEventListener("click", async () => {
  const target = $("target").value.trim();
  const port = Number($("port").value) || 443;
  const ws = $("ws").value.trim();
  const domains = [...new Set($("domains").value.split(/\r?\n/).map((s) => s.trim().toLowerCase()).filter(Boolean))];
  if (!target || !domains.length) { $("status").textContent = "Enter a target and at least one hostname."; return; }

  results = [];
  render();
  $("go").disabled = true;
  let done = 0;

  for (let i = 0; i < domains.length; i += CHUNK) {
    const batch = domains.slice(i, i + CHUNK);
    try {
      const r = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target, port, domains: batch, ws }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "request failed");
      results.push(...data.results);
    } catch (e) {
      $("status").textContent = "Error: " + e.message;
      break;
    }
    done += batch.length;
    $("prog").style.width = Math.round((done / domains.length) * 100) + "%";
    $("status").textContent = "Scanned " + done + " / " + domains.length + " — " + results.filter((r) => r.ok).length + " working";
    render();
  }
  $("go").disabled = false;
});

$("copy").addEventListener("click", async () => {
  const text = results.filter((r) => r.ok).sort((a, b) => a.ms - b.ms).map((r) => r.sni).join("\n");
  try { await navigator.clipboard.writeText(text); $("status").textContent = "Copied working hostnames."; }
  catch (_) { $("status").textContent = "Copy failed."; }
});

$("csv").addEventListener("click", () => {
  const rows = ["hostname,ok,ms,detail", ...results.map((r) => [r.sni, r.ok, r.ms ?? "", JSON.stringify(r.status || "")].join(","))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.join("\n")], { type: "text/csv" }));
  a.download = "sni_results.csv";
  a.click();
});
</script>
</body>
</html>
